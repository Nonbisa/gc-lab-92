<html lang="ko">
<head>

<meta name="description" content="URL을 입력해 QR 코드를 생성하고 PNG·JPG·클립보드로 저장하는 브라우저 도구입니다.">

  <style>
    :root{
      --bg:#ffffff;
      --card:#ffffff;
      --text:#222222;
      --muted:#6b7280;
      --brand:#0056b8;
      --brand-dark:#00479a;
      --border:#d4dbe8;
      --radius-lg:6px;
      --shadow-soft:0 10px 24px rgba(15,23,42,.06);
      --success:#067647;
      --success-soft:#ecfdf3;
      --warning:#b54708;
      --warning-soft:#fffaeb;
      --danger:#b42318;
      --danger-soft:#fef3f2;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text);}
    .app{width:1242px;margin:0 auto;padding:24px 16px 32px;}
    header{text-align:center;margin-bottom:16px;}
    header h1{font-size:24px;font-weight:600;letter-spacing:-0.02em;display:flex;align-items:center;justify-content:center;gap:8px;color:#111827;}
    .logo-badge{width:32px;height:32px;border-radius:6px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;}
    header p{margin-top:4px;font-size:13px;color:var(--muted);}
    .panel-row{display:grid;grid-template-columns:650px 560px;gap:16px;align-items:start;}
    .panel{background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-soft);padding:16px;min-width:0;margin-top:16px;height:600px;display:flex;flex-direction:column;}
    .panel-title{font-size:18px;font-weight:600;margin-bottom:8px;flex:none;}
    .panel-desc{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.55;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .config-grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,0.98fr);gap:14px;flex:1;min-height:0;}
    .input-block-title{font-size:15px;font-weight:600;margin-bottom:8px;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    textarea,input[type="text"],input[type="number"],input[type="color"],select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;color:#111827;font-size:13px;line-height:1.45;outline:none;}
    input[type="color"]{padding:4px;height:40px;cursor:pointer;}
    textarea:focus,input:focus,select:focus{border-color:#8ab4f8;}
    .url-input{height:72px;resize:none;}
    .field{margin-bottom:8px;min-width:0;}
    .field:last-child{margin-bottom:0;}
    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .inline-row{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px;align-items:end;}
    .option-card{border:1px solid var(--border);border-radius:6px;background:#fff;padding:12px;margin-bottom:10px;}
    .option-card:last-child{margin-bottom:0;}
    .option-card-title{font-size:13px;font-weight:700;color:#111827;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .status{margin-top:10px;min-height:40px;padding:9px 12px;border-radius:6px;font-size:12px;line-height:1.5;display:none;flex:none;}
    .status.show{display:block;}
    .status.success{background:var(--success-soft);color:var(--success);border:1px solid #abefc6;}
    .status.warning{background:var(--warning-soft);color:var(--warning);border:1px solid #fedf89;}
    .status.error{background:var(--danger-soft);color:var(--danger);border:1px solid #f1b8b1;}
    .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;flex:none;}
    .btn-ghost{background:#fff;color:#111827;border-radius:6px;border:1px solid var(--border);padding:8px 12px;font-size:12px;cursor:pointer;white-space:nowrap;}
    .btn-ghost:hover{background:#f8fafc;}
    .result-box{border:1px solid var(--border);border-radius:6px;background:#fff;flex:1;min-height:0;padding:14px;overflow:auto;display:flex;align-items:center;justify-content:center;}
    .result-empty{color:var(--muted);font-size:13px;line-height:1.7;text-align:center;}
    .preview-wrap{width:100%;display:flex;align-items:center;justify-content:center;padding:8px;}
    #previewCanvas{width:auto;max-width:min(100%,280px);height:auto;display:block;border-radius:4px;}
    .preview-panel .result-box{position:relative;z-index:101;background:#fff;}
    .spacer{flex:1;min-height:0;}
    @media(max-width:1280px){.app{width:auto;}.panel-row{grid-template-columns:1fr;}.panel{height:auto;min-height:520px;}.panel-desc{white-space:normal;}}
  </style>

    .app{width:auto;margin:0;padding:20px 22px 24px}header{margin-bottom:8px}header h1{font:1000 27px "Courier New","Malgun Gothic",monospace}.logo-badge{border:3px solid var(--ink);border-radius:4px;background:var(--yellow);color:var(--ink);box-shadow:3px 3px var(--ink)}header p{font:700 13px/1.5 "Malgun Gothic",sans-serif;color:#4b5552}

 var(--ink);font:700 12px/1.45 "Malgun Gothic",sans-serif;white-space:normal;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(4px);transition:.12s}.info-tip:hover:after,.info-tip:focus:after{opacity:1;visibility:visible;transform:translateY(0)}.btn-ghost{border:3px solid var(--ink);border-radius:0;background:#eee;box-shadow:3px 3px var(--ink);font-weight:900}.btn-ghost:hover{background:var(--yellow)}.btn-ghost:active{transform:translate(2px,2px);box-shadow:1px 1px var(--ink)}
    .taskbar{position:fixed;z-index:80;left:0;right:0;bottom:0;height:47px;display:flex;align-items:center;gap:6px;padding:4px 6px;background:#d3cfc2;border-top:3px solid #fff;box-shadow:0 -3px var(--ink)}.start{height:34px;padding:0 13px;border:3px solid var(--ink);background:var(--yellow);font:1000 14px "Courier New"}.task{height:34px;max-width:280px;padding:7px 11px;border:2px solid var(--ink);background:#eee;box-shadow:inset 2px 2px #777;font-weight:900;white-space:nowrap}.clock{margin-left:auto;min-width:86px;padding:7px 8px;border:2px solid #777;background:#eee;text-align:center;font-weight:900}

//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

  </script>
  <script>
    const urlTextEl = document.getElementById('urlText');
    const frameModeEl = document.getElementById('frameMode');
    const frameColorEl = document.getElementById('frameColor');
    const frameThicknessEl = document.getElementById('frameThickness');
    const frameRadiusEl = document.getElementById('frameRadius');
    const innerPaddingEl = document.getElementById('innerPadding');
    const qrSizeEl = document.getElementById('qrSize');
    const qrMarginEl = document.getElementById('qrMargin');
    const errorLevelEl = document.getElementById('errorLevel');
    const qrColorEl = document.getElementById('qrColor');
    const logoTypeEl = document.getElementById('logoType');
    const logoPositionEl = document.getElementById('logoPosition');
    const logoSizeEl = document.getElementById('logoSize');
    const resetBtn = document.getElementById('resetBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadPngBtn = document.getElementById('downloadPngBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resultBox = document.getElementById('resultBox');
    const statusBox = document.getElementById('statusBox');
    let finalCanvas = null;
    const logoSources={koVertical:'./assets/logo-ko-vertical.png',koHorizontal:'./assets/logo-ko-horizontal.png',koEnHorizontal:'./assets/logo-ko-en-horizontal.png',en:'./assets/logo-en.png'};
    const logoCache={};

    function loadLogo(type){
      if(type==='none') return Promise.resolve(null);
      if(logoCache[type]) return Promise.resolve(logoCache[type]);
      return new Promise((resolve,reject)=>{
        const image=new Image();
        image.onload=()=>{logoCache[type]=image;resolve(image)};
        image.onerror=reject;
        image.src=logoSources[type];
      });
    }

    function setStatus(type, message){
      if(!message){
        statusBox.className = 'status';
        statusBox.textContent = '';
        return;
      }
      statusBox.className = 'status show ' + type;
      statusBox.textContent = message;
    }

    function clampNumber(value, min, max, fallback){
      const num = Number(value);
      if(Number.isNaN(num)) return fallback;
      return Math.max(min, Math.min(max, num));
    }

    function drawRoundedRect(ctx, x, y, w, h, r){
      const radius = Math.max(0, Math.min(r, Math.min(w, h) / 2));
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function createQrCanvas(text, size, marginModules, level, color){
      const qr = qrcode(0, level);
      qr.addData(text, 'Byte');
      qr.make();
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      const count = qr.getModuleCount();
      const totalCount = count + (marginModules * 2);
      const tile = size / totalCount;
      const offset = marginModules * tile;
      ctx.fillStyle = color;
      ctx.imageSmoothingEnabled = false;
      for(let row = 0; row < count; row++){
        for(let col = 0; col < count; col++){
          if(!qr.isDark(row, col)) continue;
          const x = Math.round(offset + col * tile);
          const y = Math.round(offset + row * tile);
          ctx.fillRect(x, y, Math.ceil(tile), Math.ceil(tile));
        }
      }
      return canvas;
    }

    function drawLogo(ctx,image,centerX,top,maxWidth,slotHeight){
      const maxHeight=Math.max(24,slotHeight-8);
      const scale=Math.min(maxWidth/image.naturalWidth,maxHeight/image.naturalHeight);
      const width=image.naturalWidth*scale;
      const height=image.naturalHeight*scale;
      ctx.drawImage(image,centerX-(width/2),top+((slotHeight-height)/2),width,height);
    }

    async function renderPreview(){
      const url = urlTextEl.value.trim();
      if(!url){
        resultBox.innerHTML = '<div class="result-empty">URL을 입력하면 QR코드가 자동으로 생성됩니다.</div>';
        finalCanvas = null;
        setStatus('', '');
        return;
      }
      try{
        const qrSize = clampNumber(qrSizeEl.value, 160, 2000, 250);
        const qrMargin = clampNumber(qrMarginEl.value, 0, 20, 4);
        const frameThickness = clampNumber(frameThicknessEl.value, 0, 80, 10);
        const frameRadius = clampNumber(frameRadiusEl.value, 0, 120, 20);
        const innerPadding = clampNumber(innerPaddingEl.value, 0, 150, 10);
        const frameColor = frameColorEl.value || '#0056b8';
        const frameMode = frameModeEl.value || 'gradient';
        frameColorEl.disabled = frameMode === 'gradient';
        const qrColor = qrColorEl.value || '#111111';
        const level = errorLevelEl.value || 'M';
        const logoType = logoTypeEl.value || 'none';
        const logoPosition = logoPositionEl.value || 'bottom';
        const logoSize = logoSizeEl.value || 'medium';
        const logoImage = await loadLogo(logoType);
        const qrCanvas = createQrCanvas(url, qrSize, qrMargin, level, qrColor);
        const logoGap = logoImage ? ({small:52,medium:72,large:94}[logoSize] || 72) : 0;
        const frameWidth = qrSize + (innerPadding * 2) + (frameThickness * 2);
        const frameHeight = qrSize + (innerPadding * 2) + (frameThickness * 2) + logoGap;
        const canvasWidth = frameWidth + 40;
        const canvasHeight = frameHeight + 40;
        const canvas = document.createElement('canvas');
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
        const frameX = (canvasWidth - frameWidth) / 2;
        const frameY = 20;
        if(frameMode === 'gradient'){
          const gradient=ctx.createLinearGradient(frameX,frameY,frameX+frameWidth,frameY+frameHeight);
          gradient.addColorStop(0,'#3b8dcc');
          gradient.addColorStop(.5,'#8d64ad');
          gradient.addColorStop(1,'#d41478');
          ctx.fillStyle=gradient;
        }else{
          ctx.fillStyle = frameColor;
        }
        drawRoundedRect(ctx, frameX, frameY, frameWidth, frameHeight, frameRadius);
        ctx.fill();
        const innerX = frameX + frameThickness;
        const innerY = frameY + frameThickness;
        const innerWidth = frameWidth - (frameThickness * 2);
        const innerHeight = frameHeight - (frameThickness * 2);
        ctx.fillStyle = '#ffffff';
        drawRoundedRect(ctx, innerX, innerY, innerWidth, innerHeight, Math.max(0, frameRadius - frameThickness));
        ctx.fill();
        let topCursor = innerY + innerPadding;
        if(logoImage && logoPosition === 'top'){
          drawLogo(ctx,logoImage,canvasWidth/2,topCursor,innerWidth-(innerPadding*2),logoGap);
          topCursor += logoGap;
        }
        const qrDrawTop = topCursor;
        const qrDrawBottom = qrDrawTop + qrSize;
        const qrX = (canvasWidth - qrSize) / 2;
        ctx.drawImage(qrCanvas, qrX, qrDrawTop, qrSize, qrSize);
        let bottomLogoTop=qrDrawBottom;
        if(logoImage && logoPosition === 'bottom'){
          drawLogo(ctx,logoImage,canvasWidth/2,bottomLogoTop,innerWidth-(innerPadding*2),logoGap);
        }
        finalCanvas = canvas;
        resultBox.innerHTML = '<div class="preview-wrap"><canvas id="previewCanvas"></canvas></div>';
        const previewCanvas = document.getElementById('previewCanvas');
        previewCanvas.width = canvas.width;
        previewCanvas.height = canvas.height;
        previewCanvas.getContext('2d').drawImage(canvas, 0, 0);
        setStatus('', '');
      }catch(error){
        console.error(error);
        resultBox.innerHTML = '<div class="result-empty">QR코드 생성 중 오류가 발생했습니다.</div>';
        finalCanvas = null;
        setStatus('error', 'QR코드 생성 중 오류가 발생했습니다.');
      }
    }

    async function copyImage(){
      if(!finalCanvas){
        setStatus('warning', '먼저 URL을 입력하세요.');
        return;
      }
      try{
        const blob = await new Promise(resolve => finalCanvas.toBlob(resolve, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        setStatus('success', '이미지가 클립보드에 복사되었습니다.');
      }catch(error){
        console.error(error);
        setStatus('warning', '이 환경에서는 이미지 복사가 제한될 수 있습니다. JPG 다운로드를 사용하세요.');
      }
    }

    function downloadPng(){
      if(!finalCanvas){
        setStatus('warning', '먼저 URL을 입력하세요.');
        return;
      }
      const link = document.createElement('a');
      link.href = finalCanvas.toDataURL('image/png');
      link.download = 'qr-code.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setStatus('success', 'PNG 다운로드가 시작되었습니다.');
    }

    function downloadJpg(){
      if(!finalCanvas){
        setStatus('warning', '먼저 URL을 입력하세요.');
        return;
      }
      const link = document.createElement('a');
      link.href = finalCanvas.toDataURL('image/jpeg', 0.95);
      link.download = 'qr-code.jpg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setStatus('success', 'JPG 다운로드가 시작되었습니다.');
    }

    function resetAll(){
      urlTextEl.value = 'https://www.geumcheon.go.kr/portal/index.do';
      frameModeEl.value = 'gradient';
      frameColorEl.value = '#0056b8';
      frameThicknessEl.value = 10;
      frameRadiusEl.value = 20;
      innerPaddingEl.value = 10;
      qrSizeEl.value = 250;
      qrMarginEl.value = 4;
      errorLevelEl.value = 'M';
      qrColorEl.value = '#111111';
      logoTypeEl.value = 'none';
      logoPositionEl.value = 'bottom';
      logoSizeEl.value = 'medium';
      renderPreview();
    }

    [urlTextEl, frameModeEl, frameColorEl, frameThicknessEl, frameRadiusEl, innerPaddingEl, qrSizeEl, qrMarginEl, errorLevelEl, qrColorEl, logoTypeEl, logoPositionEl, logoSizeEl].forEach(el => {
      el.addEventListener('input', renderPreview);
      el.addEventListener('change', renderPreview);
    });
    document.querySelectorAll('.setting-tab').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('.setting-tab').forEach(tab=>tab.classList.toggle('active',tab===button));
      document.querySelectorAll('.setting-pane').forEach(pane=>pane.hidden=pane.id!==button.dataset.pane);
    }));
    copyBtn.addEventListener('click', copyImage);
    downloadPngBtn.addEventListener('click', downloadPng);
    downloadBtn.addEventListener('click', downloadJpg);
    resetBtn.addEventListener('click', resetAll);
    renderPreview();
  </script>
  <script src="../../assets/js/desktop.js"></script>
</body>
</html>
